name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - name: Build APK
        id: apk
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "$KEYSTORE_BASE64" && -n "$KEYSTORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            umask 077
            export KEYSTORE_FILE="$RUNNER_TEMP/clock-signing.p12"
            trap 'rm -f "$KEYSTORE_FILE"' EXIT
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
            unset KEYSTORE_BASE64
            flutter build apk --release
            echo 'variant=release' >> "$GITHUB_OUTPUT"
          else
            echo 'One or more signing secrets missing; building debug APK.'
            flutter build apk --debug
            echo 'variant=debug' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: clock-game-${{ steps.apk.outputs.variant }}
          path: build/app/outputs/flutter-apk/app-${{ steps.apk.outputs.variant }}.apk
          if-no-files-found: error
